# Hexo site configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: Dali
subtitle: Notes on taking systems apart
description: Technical notes on reverse engineering, networking, web, cloud and systems security.
keywords: reverse engineering, cybersecurity, networking, web security, cloud security, systems security, write-ups
author: Dali
language: en
timezone: Africa/Tunis

# URL
## Set this to your published site so canonical links and feeds resolve correctly.
url: https://kerneldali.github.io
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
prismjs:
  enable: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: pure

# Deployment
## Deploy with the GitHub Actions workflow in .github/workflows/pages.yml.
deploy:
  type: ''
